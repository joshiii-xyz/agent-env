[package]
name = "agent-env"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read-only local package and environment inspector"
license = "MIT"
repository = "https://github.com/joshiii-xyz/agent-env"
keywords = ["cli", "diagnostics", "cargo", "provenance"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "agent_env"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "0.8"

[dev-dependencies]
tempfile = "3.13"
